<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />

  <!-- ═══ SECURITY HEADERS ═══════════════════════════════════════════════ -->
  <!-- Previne clickjacking: impede que o app seja embutido em iframes externos -->
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <!-- Previne MIME-sniffing -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <!-- Controla informações do Referer enviadas a terceiros -->
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <!-- Content Security Policy: restringe origens de scripts e recursos -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob: https://*.supabase.co https://supabase.co;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://bitn8n.infinityflowapp.com https://openrouter.ai;
    frame-ancestors 'self';
    object-src 'none';
    base-uri 'self';
  " />
  <!-- ════════════════════════════════════════════════════════════════════ -->

  <title>Uniforme Premiado</title>
  <meta name="description" content="Uniforme Premiado - BIT Educação & Negócios" />
  <meta name="author" content="HenryDev" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#09090b" />
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/img/icon-512x512.png" />
  <link rel="apple-touch-icon" href="/img/icon-192x192.png" />
</head>

<body>
  <div id="root">
    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #09090b; /* Match manifest background_color */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .splash-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 40px;
        animation: splash-pulse 2s infinite ease-in-out;
        filter: drop-shadow(0 0 20px rgba(234, 179, 8, 0.2)); /* subtle glow */
      }
      .splash-loader-container {
        width: 220px;
        height: 6px;
        background-color: #27272a;
        border-radius: 10px;
        position: relative;
        overflow: hidden;
      }
      .splash-loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, #eab308, #f59e0b); /* bit colors */
        border-radius: 10px;
        animation: splash-loading 1.5s infinite ease-in-out;
      }

      @keyframes splash-pulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }

      @keyframes splash-loading {
        0% { left: -50%; }
        100% { left: 100%; }
      }
    </style>
    <div id="splash-screen">
      <img src="/img/icon-512x512.png" alt="Carregando..." class="splash-logo" />
      <div class="splash-loader-container">
        <div class="splash-loader-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
